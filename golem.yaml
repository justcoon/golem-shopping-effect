# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.6.0

app: golem-shopping-effect

version:
  git:
    tagPattern: "v*"
    hashFallback: true
    staticFallback: "v0.0.0"

environments:
  local:
    server: local
    version:
      git:
        allowDirty: true
  cloud:
    server: cloud
    deployment:
      versionCheck: true
components:
  golem-shopping-effect:effect-main:
    dir: ""
    templates: effect
agents:
  WebAssistant:
    files:
    - sourcePath: ./web/
      targetPath: /web/
      permissions: read-only
  WebManager:
    files:
    - sourcePath: ./web/
      targetPath: /web/
      permissions: read-only
secretDefaults:
  local:
    llm:
#      apiKey: '{{ OPENROUTER_KEY }}'
#      model: "openrouter/free"
      apiKey: '{{ GEMINI_API_KEY }}'
      model: "gemini-3.1-flash-lite"
      apiUrl: "https://generativelanguage.googleapis.com/v1beta"
httpApi:
  deployments:
    local:
    - domain: localhost:9006
      agents:
        PricingAgent: {}
        ProductAgent: {}
        ProductSearchAgent: {}
        InventoryAgent: {}
        ShoppingAssistantAgent: {}
        ShoppingRecommendationAgent: {}
        CartAgent: {}
        OrderAgent: {}
        OrderSearchAgent: {}
        ManagerAgent: {}
        WebAssistant: {}
        WebManager: {}
